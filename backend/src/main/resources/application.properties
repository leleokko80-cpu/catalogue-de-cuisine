   spring.application.name=backend
   server.port=8081
   server.error.include-message=always

   spring.datasource.url=jdbc:mysql://localhost:3306/recipe_catalog?createDatabaseIfNotExist=true&serverTimezone=UTC
   spring.datasource.username=${DB_USERNAME:root}
   spring.datasource.password=${DB_PASSWORD:root}
   spring.jpa.hibernate.ddl-auto=update
   spring.jpa.open-in-view=false

   # used by Tessnim's JWT code
   app.jwt.secret=change-this-to-a-long-random-string-at-least-32-characters
   app.jwt.expiration-ms=86400000